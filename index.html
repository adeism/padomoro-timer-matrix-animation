<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer Matrix (Native CSS)</title>
    <style>
        /* --- Variabel Global & Reset Dasar --- */
        :root {
            --background-color: #000;
            --text-color: #0f0;
            --accent-color-rgb: 0, 255, 0; 
            --font-family: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: var(--font-family);
            overflow: hidden;
        }
        
        /* --- Tata Letak Utama & Latar Belakang --- */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            display: block;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* --- Elemen Tampilan Timer & Status --- */
        #timerDisplay {
            font-size: 4.5rem; /* Ukuran untuk mobile */
            font-weight: 700;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(var(--accent-color-rgb), 0.5);
        }

        #sessionStatusDisplay {
            margin-top: 0.5rem;
            font-size: 1.125rem;
            opacity: 0.8;
            height: 1.5rem; /* Mencegah layout shift */
        }
        
        /* --- Kontrol (Tombol & Select) --- */
        #controlsContainer {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: opacity 0.5s ease-in-out;
        }

        /* Kelas untuk menyembunyikan kontrol saat idle */
        .controls-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: 1px solid rgba(var(--accent-color-rgb), 0.7);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(var(--accent-color-rgb), 0.5);
            font-size: 1.125rem;
            cursor: pointer;
        }

        .btn-custom:hover {
            background-color: rgba(var(--accent-color-rgb), 0.2);
            box-shadow: 0 0 20px rgba(var(--accent-color-rgb), 0.8);
        }

        .btn-custom:focus {
            outline: 2px solid var(--text-color);
            outline-offset: 2px;
        }
        
        #optionsButton svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        select.btn-custom {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* --- Dialog (Modal) --- */
        dialog {
            background-color: var(--background-color);
            color: var(--text-color);
            border: 1px solid rgba(var(--accent-color-rgb), 0.5);
            box-shadow: 0 0 30px rgba(var(--accent-color-rgb), 0.5);
            padding: 1.5rem;
            border-radius: 0.75rem;
            max-width: 480px;
            width: 95%;
            /* FIX: Memastikan dialog selalu di tengah */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        dialog[open] {
            display: block; /* Atau flex, grid, dll. sesuai kebutuhan */
        }


        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }
        
        /* --- Elemen Form di dalam Dialog Pengaturan --- */
        #optionsForm {
            font-size: 0.875rem;
        }
        
        #optionsForm h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .options-grid-container {
            display: grid;
            grid-template-columns: 1fr; /* 1 kolom di mobile */
            gap: 1rem;
        }
        
        #optionsForm fieldset {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.75rem;
            border-radius: 0.25rem;
        }

        #optionsForm legend {
            padding: 0 0.5rem;
        }
        
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.75rem;
        }
        .form-row:first-child { margin-top: 0; }

        .input-style {
            width: 5rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            text-align: center;
        }
        .input-style:focus {
            outline: none;
            ring: 2px solid var(--text-color);
        }
        
        /* Custom Toggle Switch */
        .toggle-container {
            position: relative;
            display: inline-block;
            width: 2.5rem;
            height: 1.5rem;
            vertical-align: middle;
        }
        .toggle-checkbox {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: 0.3s;
            border-radius: 1.5rem;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 1.25rem;
            width: 1.25rem;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        .toggle-checkbox:checked + .toggle-slider {
            background-color: var(--text-color);
        }
        .toggle-checkbox:checked + .toggle-slider:before {
            transform: translateX(1rem);
        }

        .form-buttons-container {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* --- Responsivitas --- */
        @media (min-width: 768px) {
            #timerDisplay {
                font-size: 6rem; /* Ukuran lebih besar untuk desktop */
            }
            .options-grid-container {
                grid-template-columns: 1fr 1fr; /* 2 kolom di desktop */
                column-gap: 2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    
    <audio id="sound-chime" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-clear-interface-beep-1215.mp3" preload="auto"></audio>
    <audio id="sound-beep" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto"></audio>
    <audio id="sound-digital" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-quick-positive-video-game-notification-interface-265.mp3" preload="auto"></audio>

    <main>
        <div id="timerDisplay">25:00</div>
        <div id="sessionStatusDisplay">Sesi Kerja 1/4</div>

        <div id="controlsContainer">
            <button id="startStopButton" class="btn-custom">Mulai</button>
            <button id="resetButton" class="btn-custom">Reset</button>
            <select id="themeSelect" class="btn-custom">
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
            </select>
            <button id="optionsButton" class="btn-custom" title="Pengaturan">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
        </div>
    </main>
    
    <dialog id="optionsDialog">
        <form id="optionsForm">
            <h2>Pengaturan Lanjutan</h2>
            <div class="options-grid-container">
                <fieldset>
                    <legend>Siklus Pomodoro</legend>
                    <div class="form-row"><label for="workDurationInput">Kerja (menit)</label><input type="number" id="workDurationInput" min="1" class="input-style"></div>
                    <div class="form-row"><label for="breakDurationInput">Istirahat (menit)</label><input type="number" id="breakDurationInput" min="1" class="input-style"></div>
                    <div class="form-row"><label for="longBreakDurationInput">Istirahat Panjang</label><input type="number" id="longBreakDurationInput" min="1" class="input-style"></div>
                    <div class="form-row"><label for="cyclesInput">Siklus / Istirahat Pjg</label><input type="number" id="cyclesInput" min="1" class="input-style"></div>
                    <div class="form-row"><label for="autoStartToggle">Mulai Otomatis</label><label class="toggle-container"><input type="checkbox" id="autoStartToggle" class="toggle-checkbox"><span class="toggle-slider"></span></label></div>
                </fieldset>
                
                <fieldset>
                    <legend>Visual & Suara</legend>
                    <div class="form-row"><label for="animationSpeedSelect">Kecepatan Animasi</label><select id="animationSpeedSelect" class="input-style" style="width: 7rem;"><option value="35">Normal</option><option value="50">Lambat</option><option value="20">Cepat</option></select></div>
                    <div class="form-row"><label for="charSetSelect">Set Karakter</label><select id="charSetSelect" class="input-style" style="width: 7rem;"><option value="classic">Klasik</option><option value="binary">Biner</option><option value="katakana">Katakana</option></select></div>
                    <div class="form-row"><label for="soundSelect">Suara Notifikasi</label><select id="soundSelect" class="input-style" style="width: 7rem;"><option value="chime">Chime</option><option value="beep">Beep</option><option value="digital">Digital</option></select></div>
                    <div class="form-row" style="flex-direction: column; align-items: stretch;"><label for="volumeSlider" style="align-self: flex-start;">Volume</label><input type="range" id="volumeSlider" min="0" max="1" step="0.1" style="width: 100%; margin-top: 0.25rem;"></div>
                </fieldset>
            </div>
            <div class="form-buttons-container">
                <button type="button" id="cancelOptionsButton" class="btn-custom">Batal</button>
                <button type="submit" class="btn-custom">Simpan & Reset</button>
            </div>
        </form>
    </dialog>

    <dialog id="sessionCompleteDialog"><div id="sessionCompleteContent"><h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;"></h2><p style="margin-bottom: 1.5rem;"></p><div style="display: flex; gap: 1rem;"><button class="btn-custom next-session-btn">Lanjut</button><button class="btn-custom skip-session-btn">Lewati</button></div></div></dialog>
    
    <script>
    let config = {
        workDuration: 25 * 60,
        breakDuration: 5 * 60,
        longBreakDuration: 15 * 60,
        cyclesBeforeLongBreak: 4,
        autoStart: false,
        animationInterval: 35,
        notificationSound: 'chime',
        volume: 0.5,
        charSets: {
            classic: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%$#@!',
            binary: '0101010101010101010101',
            katakana: 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン'
        },
        activeCharSet: 'classic'
    };
    let state = {
        timeLeftInSeconds: config.workDuration,
        currentCycle: 1,
        isRunning: false,
        isBreakTime: false,
        isLongBreak: false,
        timerInterval: null,
        idleTimeout: null,
        expectedEndTime: null,
        volumeDebounceTimeout: null // Untuk preview volume
    };

    const dom = {
        canvas: document.getElementById('matrixCanvas'),
        timerDisplay: document.getElementById('timerDisplay'),
        sessionStatusDisplay: document.getElementById('sessionStatusDisplay'),
        controlsContainer: document.getElementById('controlsContainer'),
        startStopButton: document.getElementById('startStopButton'),
        resetButton: document.getElementById('resetButton'),
        themeSelect: document.getElementById('themeSelect'),
        optionsButton: document.getElementById('optionsButton'),
        optionsDialog: document.getElementById('optionsDialog'),
        optionsForm: document.getElementById('optionsForm'),
        sessionCompleteDialog: document.getElementById('sessionCompleteDialog'),
        sessionCompleteContent: document.getElementById('sessionCompleteContent').firstElementChild,
        sounds: {
            chime: document.getElementById('sound-chime'),
            beep: document.getElementById('sound-beep'),
            digital: document.getElementById('sound-digital'),
        },
        // Grupkan elemen form untuk akses mudah
        form: {
            workDuration: document.getElementById('workDurationInput'),
            breakDuration: document.getElementById('breakDurationInput'),
            longBreakDuration: document.getElementById('longBreakDurationInput'),
            cycles: document.getElementById('cyclesInput'),
            autoStart: document.getElementById('autoStartToggle'),
            animationSpeed: document.getElementById('animationSpeedSelect'),
            charSet: document.getElementById('charSetSelect'),
            sound: document.getElementById('soundSelect'),
            volume: document.getElementById('volumeSlider'),
            cancelButton: document.getElementById('cancelOptionsButton')
        }
    };
    const ctx = dom.canvas.getContext('2d');
    let matrixColumns, matrixDrops;
    let matrixColor = '#0f0';
    const MATRIX_FONT_SIZE = 12;
    const IDLE_TIMEOUT_MS = 3000;

    // --- UI LOGIC ---
    function hideControls() { dom.controlsContainer.classList.add('controls-hidden'); }
    function showControls() {
        dom.controlsContainer.classList.remove('controls-hidden');
        clearTimeout(state.idleTimeout);
        state.idleTimeout = setTimeout(hideControls, IDLE_TIMEOUT_MS);
    }
    
    function updateTimerDisplay() {
        const minutes = Math.floor(state.timeLeftInSeconds / 60);
        let seconds = state.timeLeftInSeconds % 60;
        dom.timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        document.title = `${dom.timerDisplay.innerText} - ${state.isBreakTime ? 'Istirahat' : 'Kerja'}`;
    }

    function updateStatusDisplay() {
        if(state.isLongBreak) {
            dom.sessionStatusDisplay.innerText = 'Istirahat Panjang';
        } else if (state.isBreakTime) {
            dom.sessionStatusDisplay.innerText = `Istirahat (Siklus ${state.currentCycle-1})`;
        } else {
            dom.sessionStatusDisplay.innerText = `Sesi Kerja ${state.currentCycle}/${config.cyclesBeforeLongBreak}`;
        }
    }

    // --- ANIMATION LOGIC ---
    function setupCanvas() {
        dom.canvas.width = window.innerWidth;
        dom.canvas.height = window.innerHeight;
        matrixColumns = Math.floor(dom.canvas.width / MATRIX_FONT_SIZE);
        matrixDrops = Array(matrixColumns).fill(1);
    }

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, dom.canvas.width, dom.canvas.height);
        ctx.fillStyle = matrixColor;
        ctx.font = `${MATRIX_FONT_SIZE}px ${getComputedStyle(document.body).fontFamily}`;
        const chars = config.charSets[config.activeCharSet];
        for (let i = 0; i < matrixDrops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * MATRIX_FONT_SIZE, matrixDrops[i] * MATRIX_FONT_SIZE);
            if (matrixDrops[i] * MATRIX_FONT_SIZE > dom.canvas.height && Math.random() > 0.975) {
                matrixDrops[i] = 0;
            }
            matrixDrops[i]++;
        }
    }

    // --- TIMER & CYCLE LOGIC ---
    function playSound(soundId, volume) {
        const sound = dom.sounds[soundId];
        if (sound) {
            sound.currentTime = 0;
            sound.volume = volume;
            sound.play().catch(e => console.warn("Audio play failed:", e));
        }
    }

    function startNextSession(skipped = false) {
        state.isRunning = false;
        clearInterval(state.timerInterval);

        if (state.isBreakTime || state.isLongBreak) { 
            state.isBreakTime = false;
            state.isLongBreak = false;
            if(!skipped) state.currentCycle++;
            state.timeLeftInSeconds = config.workDuration;
        } else { 
            playSound(config.notificationSound, config.volume);
            if (state.currentCycle % config.cyclesBeforeLongBreak === 0) { 
                state.isLongBreak = true;
                state.timeLeftInSeconds = config.longBreakDuration;
            } else { 
                state.isBreakTime = true;
                state.timeLeftInSeconds = config.breakDuration;
            }
        }
        
        updateTimerDisplay();
        updateStatusDisplay();
        if (config.autoStart) {
            startStopTimer();
        } else {
            dom.startStopButton.innerText = "Mulai";
        }
    }

    function showSessionCompleteDialog() {
        const dialog = dom.sessionCompleteDialog;
        const h2 = dom.sessionCompleteContent.querySelector('h2');
        const p = dom.sessionCompleteContent.querySelector('p');

        if(state.currentCycle % config.cyclesBeforeLongBreak === 0) {
            h2.innerText = "Siklus Selesai!";
            p.innerText = `Waktunya istirahat panjang selama ${config.longBreakDuration / 60} menit.`;
        } else {
            h2.innerText = "Sesi Kerja Selesai!";
            p.innerText = `Ambil istirahat sejenak selama ${config.breakDuration / 60} menit.`;
        }
        dialog.showModal();
    }

    function startStopTimer() {
        if (state.isRunning) {
            clearInterval(state.timerInterval);
            state.isRunning = false;
            dom.startStopButton.innerText = 'Lanjut';
        } else {
            state.isRunning = true;
            dom.startStopButton.innerText = 'Jeda';
            state.expectedEndTime = Date.now() + state.timeLeftInSeconds * 1000;
            
            state.timerInterval = setInterval(() => {
                state.timeLeftInSeconds = Math.round((state.expectedEndTime - Date.now()) / 1000);
                if (state.timeLeftInSeconds <= 0) {
                    clearInterval(state.timerInterval);
                    state.isRunning = false;
                    state.timeLeftInSeconds = 0;
                    if (!state.isBreakTime && !state.isLongBreak) {
                        if(config.autoStart) {
                            startNextSession();
                        } else {
                            playSound(config.notificationSound, config.volume);
                            showSessionCompleteDialog();
                        }
                    } else {
                        playSound(config.notificationSound, config.volume);
                        startNextSession();
                    }
                }
                updateTimerDisplay();
            }, 500);
        }
    }
    
    function resetApp() {
        clearInterval(state.timerInterval);
        state.isRunning = false;
        state.isBreakTime = false;
        state.isLongBreak = false;
        state.currentCycle = 1;
        state.timeLeftInSeconds = config.workDuration;
        updateTimerDisplay();
        updateStatusDisplay();
        dom.startStopButton.innerText = 'Mulai';
    }

    // --- OPTIONS & SETTINGS ---
    function loadSettingsToUI() {
        dom.form.workDuration.value = config.workDuration / 60;
        dom.form.breakDuration.value = config.breakDuration / 60;
        dom.form.longBreakDuration.value = config.longBreakDuration / 60;
        dom.form.cycles.value = config.cyclesBeforeLongBreak;
        dom.form.autoStart.checked = config.autoStart;
        dom.form.animationSpeed.value = config.animationInterval;
        dom.form.charSet.value = config.activeCharSet;
        dom.form.sound.value = config.notificationSound;
        dom.form.volume.value = config.volume;
    }

    function saveSettingsFromUI() {
        config.workDuration = dom.form.workDuration.value * 60;
        config.breakDuration = dom.form.breakDuration.value * 60;
        config.longBreakDuration = dom.form.longBreakDuration.value * 60;
        config.cyclesBeforeLongBreak = parseInt(dom.form.cycles.value, 10);
        config.autoStart = dom.form.autoStart.checked;
        config.animationInterval = parseInt(dom.form.animationSpeed.value, 10);
        config.activeCharSet = dom.form.charSet.value;
        config.notificationSound = dom.form.sound.value;
        config.volume = parseFloat(dom.form.volume.value);
        dom.optionsDialog.close();
        resetApp();
    }
    
    // --- EVENT LISTENERS & INITIALIZATION ---
    function init() {
        window.addEventListener('mousemove', showControls);
        window.addEventListener('resize', () => { clearTimeout(state.resizeTimeout); state.resizeTimeout = setTimeout(setupCanvas, 150); });
        dom.startStopButton.addEventListener('click', startStopTimer);
        dom.resetButton.addEventListener('click', resetApp);
        
        dom.themeSelect.addEventListener('change', (e) => {
            const themes = { green: {hex:'#0f0', rgb:'0,255,0'}, blue:{hex:'#0af', rgb:'0,170,255'}, red:{hex:'#f00', rgb:'255,0,0'}, yellow:{hex:'#ff0', rgb:'255,255,0'} };
            const theme = themes[e.target.value];
            if(theme) {
                matrixColor = theme.hex;
                document.documentElement.style.setProperty('--text-color', theme.hex);
                document.documentElement.style.setProperty('--accent-color-rgb', theme.rgb);
            }
        });

        // Listeners Dialog Pengaturan
        dom.optionsButton.addEventListener('click', () => { loadSettingsToUI(); dom.optionsDialog.showModal(); });
        dom.optionsForm.addEventListener('submit', (e) => { e.preventDefault(); saveSettingsFromUI(); });
        dom.form.cancelButton.addEventListener('click', () => dom.optionsDialog.close());
        
        // Listener untuk pratinjau suara
        dom.form.sound.addEventListener('change', (e) => {
            playSound(e.target.value, dom.form.volume.value);
        });

        // Listener untuk pratinjau volume dengan debounce
        dom.form.volume.addEventListener('input', (e) => {
            const newVolume = parseFloat(e.target.value);
            clearTimeout(state.volumeDebounceTimeout);
            state.volumeDebounceTimeout = setTimeout(() => {
                playSound(dom.form.sound.value, newVolume);
            }, 250);
        });

        // Listeners Dialog Sesi Selesai
        dom.sessionCompleteDialog.querySelector('.next-session-btn').addEventListener('click', () => { dom.sessionCompleteDialog.close(); startNextSession(); });
        dom.sessionCompleteDialog.querySelector('.skip-session-btn').addEventListener('click', () => { dom.sessionCompleteDialog.close(); startNextSession(true); });
        
        setupCanvas();
        setInterval(drawMatrix, config.animationInterval);
        resetApp();
        showControls();
    }
    init();
    </script>
</body>
</html>
