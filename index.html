<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer Matrix (Advanced)</title>
    <!-- Memuat Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background-color: #000;
            --text-color: #0f0;
            --accent-color-rgb: 0, 255, 0; 
            --font-family: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--background-color); color: var(--text-color); font-family: var(--font-family); }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: -1; display: block; }
        dialog { background-color: var(--background-color); color: var(--text-color); border: 1px solid rgba(var(--accent-color-rgb), 0.5); box-shadow: 0 0 30px rgba(var(--accent-color-rgb), 0.5); padding: 1.5rem; border-radius: 0.75rem; max-width: 480px; width: 95%; }
        dialog::backdrop { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); }
        .btn-custom { display: flex; align-items: center; justify-content: center; background-color: transparent; border: 1px solid rgba(var(--accent-color-rgb), 0.7); color: var(--text-color); padding: 0.5rem 1rem; border-radius: 0.375rem; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(var(--accent-color-rgb), 0.5); }
        .btn-custom:hover { background-color: rgba(var(--accent-color-rgb), 0.2); box-shadow: 0 0 20px rgba(var(--accent-color-rgb), 0.8); }
        .btn-custom:focus { outline: 2px solid var(--text-color); outline-offset: 2px; }
        .input-style { width: 100%; p-2 rounded bg-black/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-[var(--text-color)] text-center; }
        .toggle-bg:after { content: ''; position: absolute; top: 2px; left: 2px; background: white; border-radius: 9999px; height: 1.25rem; width: 1.25rem; transition: transform 0.3s ease-in-out; }
        input:checked + .toggle-bg:after { transform: translateX(100%); }
        input:checked + .toggle-bg { background-color: var(--text-color); }
    </style>
</head>
<body class="overflow-hidden">

    <canvas id="matrixCanvas"></canvas>
    
    <!-- Audio elements for notifications -->
    <audio id="sound-chime" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-clear-interface-beep-1215.mp3" preload="auto"></audio>
    <audio id="sound-beep" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto"></audio>
    <audio id="sound-digital" src="https://proxy.gd.workers.dev/https://assets.mixkit.co/sfx/preview/mixkit-quick-positive-video-game-notification-interface-265.mp3" preload="auto"></audio>

    <main class="min-h-screen flex flex-col justify-center items-center p-4 text-center relative z-10">
        
        <div id="timerDisplay" class="text-7xl md:text-8xl font-bold bg-black/70 p-6 rounded-2xl" style="box-shadow: 0 0 30px rgba(var(--accent-color-rgb), 0.5);">25:00</div>
        <!-- Session Status Display -->
        <div id="sessionStatusDisplay" class="mt-2 text-lg opacity-80 h-6"></div>

        <div id="controlsContainer" class="mt-6 flex items-center gap-4 transition-opacity duration-500 ease-in-out">
            <button id="startStopButton" class="btn-custom text-lg">Mulai</button>
            <button id="resetButton" class="btn-custom text-lg">Reset</button>
            <select id="themeSelect" class="btn-custom text-lg appearance-none bg-black/50">
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
            </select>
            <button id="optionsButton" class="btn-custom" title="Pengaturan">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
        </div>
    </main>
    
    <!-- Dialogues -->
    <dialog id="optionsDialog">
        <form id="optionsForm" class="text-sm">
            <h2 class="text-xl font-bold mb-4 text-center">Pengaturan Lanjutan</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                <!-- Cycle Settings -->
                <fieldset class="border border-white/20 p-3 rounded">
                    <legend class="px-2">Siklus Pomodoro</legend>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <label for="workDurationInput">Kerja (menit)</label>
                            <input type="number" id="workDurationInput" min="1" class="input-style w-20">
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="breakDurationInput">Istirahat (menit)</label>
                            <input type="number" id="breakDurationInput" min="1" class="input-style w-20">
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="longBreakDurationInput">Istirahat Panjang</label>
                            <input type="number" id="longBreakDurationInput" min="1" class="input-style w-20">
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="cyclesInput">Siklus / Istirahat Pjg</label>
                            <input type="number" id="cyclesInput" min="1" class="input-style w-20">
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="autoStartToggle">Mulai Otomatis</label>
                            <div class="relative inline-block w-10 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="autoStartToggle" class="absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="autoStartToggle" class="toggle-bg block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                </fieldset>
                
                <!-- Visual & Audio Settings -->
                <fieldset class="border border-white/20 p-3 rounded">
                    <legend class="px-2">Visual & Suara</legend>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <label for="animationSpeedSelect">Kecepatan Animasi</label>
                            <select id="animationSpeedSelect" class="input-style w-28 bg-black/50"><option value="35">Normal</option><option value="50">Lambat</option><option value="20">Cepat</option></select>
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="charSetSelect">Set Karakter</label>
                            <select id="charSetSelect" class="input-style w-28 bg-black/50"><option value="classic">Klasik</option><option value="binary">Biner</option><option value="katakana">Katakana</option></select>
                        </div>
                        <div class="flex justify-between items-center">
                            <label for="soundSelect">Suara Notifikasi</label>
                            <select id="soundSelect" class="input-style w-28 bg-black/50"><option value="chime">Chime</option><option value="beep">Beep</option><option value="digital">Digital</option></select>
                        </div>
                        <div class="flex flex-col">
                            <label for="volumeSlider" class="self-start">Volume</label>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" class="w-full mt-1">
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="mt-6 flex justify-end gap-4">
                <button type="button" id="cancelOptionsButton" class="btn-custom">Batal</button>
                <button type="submit" class="btn-custom">Simpan & Reset</button>
            </div>
        </form>
    </dialog>

    <dialog id="sessionCompleteDialog"><div id="sessionCompleteContent" class="flex flex-col items-center text-center"><h2 class="text-2xl font-bold mb-2"></h2><p class="mb-6"></p><div class="flex gap-4"><button class="btn-custom next-session-btn">Lanjut</button><button class="btn-custom skip-session-btn">Lewati</button></div></div></dialog>

    <script>
    // --- CONFIG & STATE ---
    let config = {
        workDuration: 25 * 60,
        breakDuration: 5 * 60,
        longBreakDuration: 15 * 60,
        cyclesBeforeLongBreak: 4,
        autoStart: false,
        animationInterval: 35,
        notificationSound: 'chime',
        volume: 0.5,
        charSets: {
            classic: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%$#@!',
            binary: '0101010101010101010101',
            katakana: 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン'
        },
        activeCharSet: 'classic'
    };
    let state = {
        timeLeftInSeconds: config.workDuration,
        currentCycle: 1,
        isRunning: false,
        isBreakTime: false,
        isLongBreak: false,
        timerInterval: null,
        idleTimeout: null,
        expectedEndTime: null
    };

    // --- DOM ELEMENTS ---
    const dom = {
        canvas: document.getElementById('matrixCanvas'),
        timerDisplay: document.getElementById('timerDisplay'),
        sessionStatusDisplay: document.getElementById('sessionStatusDisplay'),
        controlsContainer: document.getElementById('controlsContainer'),
        startStopButton: document.getElementById('startStopButton'),
        resetButton: document.getElementById('resetButton'),
        themeSelect: document.getElementById('themeSelect'),
        optionsButton: document.getElementById('optionsButton'),
        optionsDialog: document.getElementById('optionsDialog'),
        optionsForm: document.getElementById('optionsForm'),
        sessionCompleteDialog: document.getElementById('sessionCompleteDialog'),
        sessionCompleteContent: document.getElementById('sessionCompleteContent'),
        sounds: {
            chime: document.getElementById('sound-chime'),
            beep: document.getElementById('sound-beep'),
            digital: document.getElementById('sound-digital'),
        }
    };
    const ctx = dom.canvas.getContext('2d');
    let matrixColumns, matrixDrops;
    let matrixColor = '#0f0';
    const MATRIX_FONT_SIZE = 12;
    const IDLE_TIMEOUT_MS = 3000;

    // --- UI LOGIC ---
    function hideControls() { dom.controlsContainer.classList.add('opacity-0', 'pointer-events-none'); }
    function showControls() {
        dom.controlsContainer.classList.remove('opacity-0', 'pointer-events-none');
        clearTimeout(state.idleTimeout);
        state.idleTimeout = setTimeout(hideControls, IDLE_TIMEOUT_MS);
    }
    
    function updateTimerDisplay() {
        const minutes = Math.floor(state.timeLeftInSeconds / 60);
        let seconds = state.timeLeftInSeconds % 60;
        dom.timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        document.title = `${dom.timerDisplay.innerText} - ${state.isBreakTime ? 'Istirahat' : 'Kerja'}`;
    }

    function updateStatusDisplay() {
        if(state.isLongBreak) {
            dom.sessionStatusDisplay.innerText = 'Istirahat Panjang';
        } else if (state.isBreakTime) {
            dom.sessionStatusDisplay.innerText = `Istirahat (Siklus ${state.currentCycle-1})`;
        } else {
            dom.sessionStatusDisplay.innerText = `Sesi Kerja ${state.currentCycle}/${config.cyclesBeforeLongBreak}`;
        }
    }

    // --- ANIMATION LOGIC ---
    function setupCanvas() {
        dom.canvas.width = window.innerWidth;
        dom.canvas.height = window.innerHeight;
        matrixColumns = Math.floor(dom.canvas.width / MATRIX_FONT_SIZE);
        matrixDrops = Array(matrixColumns).fill(1);
    }

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, dom.canvas.width, dom.canvas.height);
        ctx.fillStyle = matrixColor;
        ctx.font = `${MATRIX_FONT_SIZE}px ${getComputedStyle(document.body).fontFamily}`;
        const chars = config.charSets[config.activeCharSet];
        for (let i = 0; i < matrixDrops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * MATRIX_FONT_SIZE, matrixDrops[i] * MATRIX_FONT_SIZE);
            if (matrixDrops[i] * MATRIX_FONT_SIZE > dom.canvas.height && Math.random() > 0.975) {
                matrixDrops[i] = 0;
            }
            matrixDrops[i]++;
        }
    }

    // --- TIMER & CYCLE LOGIC ---
    function playNotification() {
        const sound = dom.sounds[config.notificationSound];
        if (sound) {
            sound.currentTime = 0;
            sound.volume = config.volume;
            sound.play().catch(e => console.warn("Audio play failed:", e));
        }
    }

    function startNextSession(skipped = false) {
        state.isRunning = false;
        clearInterval(state.timerInterval);

        if (state.isBreakTime || state.isLongBreak) { // Was on a break, start work
            state.isBreakTime = false;
            state.isLongBreak = false;
            if(!skipped) state.currentCycle++;
            state.timeLeftInSeconds = config.workDuration;
        } else { // Was working, start a break
            playNotification();
            if (state.currentCycle % config.cyclesBeforeLongBreak === 0) { // Time for a long break
                state.isLongBreak = true;
                state.timeLeftInSeconds = config.longBreakDuration;
            } else { // Regular break
                state.isBreakTime = true;
                state.timeLeftInSeconds = config.breakDuration;
            }
        }
        
        updateTimerDisplay();
        updateStatusDisplay();
        if (config.autoStart) {
            startStopTimer();
        } else {
            dom.startStopButton.innerText = "Mulai";
        }
    }

    function showSessionCompleteDialog() {
        const dialog = dom.sessionCompleteDialog;
        const content = dom.sessionCompleteContent;
        const h2 = content.querySelector('h2');
        const p = content.querySelector('p');

        if(state.currentCycle % config.cyclesBeforeLongBreak === 0) {
            h2.innerText = "Siklus Selesai!";
            p.innerText = `Waktunya istirahat panjang selama ${config.longBreakDuration / 60} menit.`;
        } else {
            h2.innerText = "Sesi Kerja Selesai!";
            p.innerText = `Ambil istirahat sejenak selama ${config.breakDuration / 60} menit.`;
        }
        dialog.showModal();
    }

    function startStopTimer() {
        if (state.isRunning) {
            clearInterval(state.timerInterval);
            state.isRunning = false;
            dom.startStopButton.innerText = 'Lanjut';
        } else {
            state.isRunning = true;
            dom.startStopButton.innerText = 'Jeda';
            state.expectedEndTime = Date.now() + state.timeLeftInSeconds * 1000;
            
            state.timerInterval = setInterval(() => {
                state.timeLeftInSeconds = Math.round((state.expectedEndTime - Date.now()) / 1000);
                if (state.timeLeftInSeconds <= 0) {
                    clearInterval(state.timerInterval);
                    state.isRunning = false;
                    state.timeLeftInSeconds = 0;
                    if (!state.isBreakTime && !state.isLongBreak) {
                        if(config.autoStart) {
                            startNextSession();
                        } else {
                            playNotification();
                            showSessionCompleteDialog();
                        }
                    } else { // End of break
                        playNotification();
                        startNextSession();
                    }
                }
                updateTimerDisplay();
            }, 500);
        }
    }
    
    function resetApp() {
        clearInterval(state.timerInterval);
        state.isRunning = false;
        state.isBreakTime = false;
        state.isLongBreak = false;
        state.currentCycle = 1;
        state.timeLeftInSeconds = config.workDuration;
        updateTimerDisplay();
        updateStatusDisplay();
        dom.startStopButton.innerText = 'Mulai';
    }

    // --- OPTIONS & SETTINGS ---
    function loadSettingsToUI() {
        document.getElementById('workDurationInput').value = config.workDuration / 60;
        document.getElementById('breakDurationInput').value = config.breakDuration / 60;
        document.getElementById('longBreakDurationInput').value = config.longBreakDuration / 60;
        document.getElementById('cyclesInput').value = config.cyclesBeforeLongBreak;
        document.getElementById('autoStartToggle').checked = config.autoStart;
        document.getElementById('animationSpeedSelect').value = config.animationInterval;
        document.getElementById('charSetSelect').value = config.activeCharSet;
        document.getElementById('soundSelect').value = config.notificationSound;
        document.getElementById('volumeSlider').value = config.volume;
    }

    function saveSettingsFromUI() {
        config.workDuration = document.getElementById('workDurationInput').value * 60;
        config.breakDuration = document.getElementById('breakDurationInput').value * 60;
        config.longBreakDuration = document.getElementById('longBreakDurationInput').value * 60;
        config.cyclesBeforeLongBreak = document.getElementById('cyclesInput').value;
        config.autoStart = document.getElementById('autoStartToggle').checked;
        config.animationInterval = parseInt(document.getElementById('animationSpeedSelect').value);
        config.activeCharSet = document.getElementById('charSetSelect').value;
        config.notificationSound = document.getElementById('soundSelect').value;
        config.volume = document.getElementById('volumeSlider').value;
        dom.optionsDialog.close();
        resetApp();
    }
    
    // --- EVENT LISTENERS ---
    function initListeners() {
        window.addEventListener('mousemove', showControls);
        window.addEventListener('resize', () => { clearTimeout(state.resizeTimeout); state.resizeTimeout = setTimeout(setupCanvas, 150); });
        dom.startStopButton.addEventListener('click', startStopTimer);
        dom.resetButton.addEventListener('click', resetApp);
        
        // Theme
        dom.themeSelect.addEventListener('change', (e) => {
            const themes = { green: {hex:'#0f0'}, blue:{hex:'#0af'}, red:{hex:'#f00'}, yellow:{hex:'#ff0'} };
            matrixColor = themes[e.target.value].hex;
            document.documentElement.style.setProperty('--text-color', matrixColor);
        });

        // Options Dialog
        dom.optionsButton.addEventListener('click', () => { loadSettingsToUI(); dom.optionsDialog.showModal(); });
        dom.optionsForm.addEventListener('submit', (e) => { e.preventDefault(); saveSettingsFromUI(); });
        document.getElementById('cancelOptionsButton').addEventListener('click', () => dom.optionsDialog.close());

        // Session Complete Dialog
        dom.sessionCompleteDialog.querySelector('.next-session-btn').addEventListener('click', () => { dom.sessionCompleteDialog.close(); startNextSession(); });
        dom.sessionCompleteDialog.querySelector('.skip-session-btn').addEventListener('click', () => { dom.sessionCompleteDialog.close(); startNextSession(true); });
    }

    // --- INITIALIZATION ---
    function init() {
        setupCanvas();
        setInterval(drawMatrix, config.animationInterval); // Initial animation interval
        resetApp();
        initListeners();
        showControls();
    }
    init();

    </script>
</body>
</html>
